name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://goatride:goatride@localhost:5432/goatride
  BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Migrate & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: goatride
          POSTGRES_PASSWORD: goatride
          POSTGRES_DB: goatride
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U goatride"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a clean database
        run: pnpm prisma migrate deploy
      - name: Check schema.prisma matches the migrated database
        run: >-
          pnpm prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code
      - run: pnpm build
